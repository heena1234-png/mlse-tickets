<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MLSE Tickets | Official Matchday Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #da291c;
      --primary-hover: #b81d12;
      --bg-main: #0a0a0c;
      --card-bg: #141418;
      --card-border: #27272f;
      --input-bg: #1b1b22;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --error: #ef4444;
      --error-bg: #451010;
      --success: #10b981;
      --success-bg: #064e3b;
    }

    * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 24px 16px; line-height: 1.5; }
    .portal-container { max-width: 1100px; margin: 0 auto; }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 22px;
      background: #000000;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.7);
    }
    .brand-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-logo-img {
      height: 34px;
      width: auto;
      object-fit: contain;
      display: block;
    }
    .brand-text-fallback {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .brand-text-fallback .rogers-tag {
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .portal-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(218, 41, 28, 0.15);
      color: #ff8078;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(218, 41, 28, 0.3);
    }
    .config-trigger {
      background: #1b1b22;
      border: 1px solid #33333d;
      color: #cbd5e1;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .config-trigger:hover { color: #fff; border-color: var(--primary); background: #24242e; }

    .checkout-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 24px; }
    @media (max-width: 860px) { .checkout-grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
    }

    .hero-banner {
      background: linear-gradient(135deg, #180505 0%, #290808 50%, #000000 100%);
      border-left: 4px solid var(--primary);
      color: white;
      border-radius: 8px;
      padding: 20px 22px;
      margin-bottom: 24px;
      border-top: 1px solid rgba(255,255,255,0.05);
      border-right: 1px solid rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .hero-banner h1 { margin: 0 0 6px 0; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; color: #fff; }
    .hero-banner p { margin: 0; color: #cbd5e1; font-size: 13px; }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      color: #cbd5e1;
      margin: 22px 0 14px 0;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--card-border);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
    .req { color: var(--primary); font-weight: 700; }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--input-bg);
      color: #ffffff;
      transition: all 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(218, 41, 28, 0.25);
    }
    input.input-error, select.input-error { border-color: var(--error) !important; background-color: #241111; }
    .error-text { font-size: 11px; color: #f87171; margin-top: 4px; display: none; font-weight: 600; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .package-container { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
    .package-card {
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s;
      background: #101014;
    }
    .package-card:hover { border-color: #4b4b58; background: #16161c; }
    .package-card.selected { border-color: var(--primary) !important; background-color: #220b0b !important; }
    
    .pkg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .pkg-name { font-weight: 700; font-size: 14px; color: #ffffff; display: flex; align-items: center; gap: 8px; }
    .pkg-radio { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
    .pkg-price { font-weight: 800; font-size: 16px; color: #ffffff; }
    .pkg-desc { font-size: 12px; color: var(--text-muted); margin-left: 24px; }
    .pkg-tier-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      background: #3b0d0c;
      color: #ff9994;
      padding: 2px 7px;
      border-radius: 4px;
      margin-left: 6px;
      border: 1px solid rgba(218, 41, 28, 0.4);
    }

    .summary-card {
      background: #0d0d10;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 18px;
      margin: 20px 0;
    }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 9px; font-size: 13px; color: var(--text-muted); }
    .summary-row.total {
      border-top: 1px dashed #33333d;
      padding-top: 12px;
      margin-top: 12px;
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
    }

    .checkout-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .checkout-btn:hover { background: var(--primary-hover); }
    .checkout-btn:disabled { background: #441818; color: #888; cursor: not-allowed; }

    .alert { margin-top: 16px; padding: 16px; border-radius: 8px; font-size: 13px; display: none; line-height: 1.6; }
    .alert-success { background: var(--success-bg); color: #6ee7b7; border: 1px solid #059669; }
    .alert-error { background: var(--error-bg); color: #fca5a5; border: 1px solid #dc2626; }

    #adminModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal-box {
      background: #141418;
      border: 1px solid var(--card-border);
      color: #fff;
      border-radius: 12px;
      padding: 26px;
      max-width: 480px;
      width: 90%;
    }
  </style>
</head>
<body>

<div class="portal-container">
  <header class="header-nav">
    <div class="brand-container">
      <img src="mlse-logo.png" alt="Rogers x MLSE Logo" class="brand-logo-img" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
      <div id="logoFallback" class="brand-text-fallback" style="display: none;">
        <span class="rogers-tag">🔴 ROGERS</span> <span>× MLSE</span>
      </div>
      <span class="portal-badge">Tickets & Loyalty</span>
    </div>
    <div class="nav-actions">
      <button type="button" class="config-trigger" onclick="openSettings()">⚙️ Connected App Config</button>
    </div>
  </header>

  <form id="orderForm" autocomplete="off" onsubmit="return false;">
    <div class="checkout-grid">
      <div class="card">
        <div class="hero-banner">
          <h1>Matchday Ticket Gateway</h1>
          <p>Direct ticket issue and automatic MLSE Loyalty Program tier progression.</p>
